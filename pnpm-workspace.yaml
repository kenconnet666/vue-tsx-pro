packages:
  - packages/*
  - apps/*

# 共享依赖的精确版本；各包用 "catalog:" 引用，升级只改这里
catalog:
  # 框架与编译
  vue: 3.5.44
  '@vitejs/plugin-vue-jsx': 5.1.6
  '@babel/core': 7.29.7
  '@types/babel__core': 7.20.5
  '@types/babel__traverse': 7.28.0
  # 宿主示例（apps/host-demo）：普通 Vue 项目常用的三件套
  '@vitejs/plugin-vue': 6.0.10
  vue-router: 5.4.0
  pinia: 4.1.0
  # 组件库工具：算法与数据，组件本身自己写
  '@floating-ui/dom': 1.8.0
  '@lucide/icons': 1.59.0
  '@internationalized/date': 3.12.4
  '@standard-schema/spec': 1.1.0
  decimal.js: 10.6.0
  tabbable: 6.5.0
  # 样式
  '@stylexjs/stylex': 0.19.1
  '@stylexjs/unplugin': 0.19.1
  # 色板（只用于校验 tokens 取值）
  '@radix-ui/colors': 3.0.0
  # 构建与测试
  vite: 8.3.4
  vitest: 5.0.5
  happy-dom: 21.0.3
  playwright: 1.64.1
  '@vitest/browser-playwright': 5.0.5
  axe-core: 4.14.0
  tsdown: 0.23.1
  vitepress: 2.0.0-alpha.20
  # 语言与工具
  '@modelcontextprotocol/sdk': 1.32.1
  # CSS 注释数据（scripts/css-docs）：事实字段来源
  mdn-data: 2.37.2
  web-features: 3.43.0
  zod: 4.6.7
  smol-toml: 1.9.1
  typescript: 6.0.3
  '@types/node': 24.19.2
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  prettier: 3.9.10
  '@prettier/plugin-oxc': 0.2.3

minimumReleaseAgeExclude:
  - '@lucide/icons@1.59.0'
