packages:
  - packages/*
  - apps/*

# 共享依赖的精确版本；各包用 "catalog:" 引用，升级只改这里
catalog:
  # 框架与编译
  vue: 3.5.44
  # 编译器（packages/tsx）：Babel 8 一次解析，组合符文、token 写法、StyleX、Vue JSX 与去类型
  '@babel/core': 8.0.7
  '@babel/plugin-transform-typescript': 8.0.6
  '@vue/babel-plugin-jsx': 3.0.0
  # StyleX 官方插件仍声明 Babel 7（自带一份 7 的 traverse、types），在 Babel 8 下实测输出一致
  '@stylexjs/babel-plugin': 0.19.1
  # 文档站的代码演练场在浏览器里编译用户代码（与 Vite 预设同一套插件）
  '@babel/parser': 8.0.7
  '@babel/traverse': 8.0.7
  '@babel/types': 8.0.6
  # Babel 在浏览器里要的 path（Worker 里映射 path → pathe）
  pathe: 2.0.3
  # 文档站代码演练场的编辑器（CodeMirror 6，进入演练场才加载）
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/commands': 6.11.1
  '@codemirror/lang-javascript': 6.2.5
  '@codemirror/language': 6.13.1
  '@codemirror/search': 6.7.2
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.14
  '@lezer/highlight': 1.2.5
  # 宿主示例（apps/host-demo）：普通 Vue 项目常用的三件套
  '@vitejs/plugin-vue': 6.0.10
  vue-router: 5.4.0
  pinia: 4.1.0
  # 组件库工具：算法与数据，组件本身自己写
  '@floating-ui/dom': 1.8.0
  '@lucide/icons': 1.59.0
  '@internationalized/date': 3.12.4
  decimal.js: 10.6.0
  tabbable: 6.5.0
  # 表单校验（peer，使用方安装；scripts 里也用它校验数据）
  zod: 4.6.7
  # 动画引擎（MIT）：animate、timeline、spring、stagger、拖拽、布局动画、滚动观察
  animejs: 4.5.0
  # 可选 peer 依赖（组件库开发时安装）：常规图表 Unovis、3D three.js、代码高亮 Shiki
  '@unovis/ts': 1.7.1
  three: 0.186.1
  '@types/three': 0.186.0
  shiki: 4.5.0
  # Shiki 的单个语言（@shikijs/langs/tsx）：仓库里的应用只加载用到的几种，与 shiki 同版本
  '@shikijs/langs': 4.5.0
  # 样式
  '@stylexjs/stylex': 0.19.1
  # 预设把 StyleX 规则合成 CSS 时用的处理器与目标浏览器；预设要关掉它对 :dir() 的降级（见 tsx/src/vite/stylex.ts）
  lightningcss: 1.33.0
  browserslist: 4.29.3
  # 色板（只用于校验 tokens 取值）
  '@radix-ui/colors': 3.0.0
  # 颜色解析、转换与对比度（主题编辑器、themes:check）；按函数引入（culori/fn）
  culori: 4.0.2
  '@types/culori': 4.0.1
  # 构建与测试
  vite: 8.3.4
  vitest: 5.0.5
  happy-dom: 21.0.3
  playwright: 1.64.1
  '@vitest/browser-playwright': 5.0.5
  axe-core: 4.14.0
  tsdown: 0.23.1
  # 语言与工具
  '@modelcontextprotocol/sdk': 1.32.1
  # CSS 注释数据（scripts/css-docs）：事实字段来源
  mdn-data: 2.37.2
  web-features: 3.43.0
  smol-toml: 1.9.1
  typescript: 6.0.3
  # 类型检查（各包的 typecheck、CI）用 TypeScript 7（Go 原生版，快 5–7 倍）。它没有 JS API：
  # 用 API 的脚本、语言服务与 IDE 仍用上面的 typescript 6；两者都提供 tsc 命令，脚本里按路径调用 7
  typescript7: npm:typescript@7.0.2
  # Claude Code 原生 LSP（.claude/marketplace 里的 vue-tsx-pro-lsp 插件）用的语言服务器
  typescript-language-server: 6.0.2
  '@types/node': 24.19.2
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  prettier: 3.9.10
  '@prettier/plugin-oxc': 0.2.3

minimumReleaseAgeExclude:
  - '@lucide/icons@1.59.0'

# 仓库内的 Node 进程（Vite / Vitest 配置、脚本）直接解析各包源码，不用先构建：
# 改了 tsx 的编译器或 ui 的组件立刻生效。配置文件要用 --configLoader native 加载（Node 自己去掉类型），
# 默认的打包加载会绕过这个条件、去读 dist
nodeOptions: '--conditions=@vue-tsx-pro/source'
