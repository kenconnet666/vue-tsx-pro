# 站点本身：80（nginx.conf）与 443（有证书时由 40-docs-tls.sh 生成的 tls.conf）两个 server 共用这一份

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;

# 在 server 里单写 types 会整个替换默认表，所以先引入默认表再补 glb（文档站的 3D 示例用到）
include /etc/nginx/mime.types;
types {
    model/gltf-binary glb;
}

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# 文件名带内容哈希，改了内容文件名就变，可以长期缓存
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 入口页每次都要重新确认，才能拿到新版本的 assets
location ~ \.html$ {
    add_header Cache-Control "no-cache";
}

# 路由用的是 history 模式：预渲染过的页面在 <地址>.html；没有对应文件的地址（/frame/...、找不到的页面）交给不带正文的入口页 spa.html，由浏览器渲染
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /spa.html;
}
