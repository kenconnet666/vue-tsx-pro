name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 五个任务并行。静态检查与系统无关，只在 Ubuntu 上跑；
# 测试与构建在 Windows 上也跑：本地开发在 Windows，路径与虚拟模块问题只会在那里暴露
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 与本地推送前跑的是同一个脚本
      - run: pnpm check
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 浏览器从 Playwright 的 CDN 下载，偶尔连不上（TLS、超时）：重试三次再算失败
      - name: Install browsers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm test:browser
      # 偶发失败只在 CI 上出现时，靠失败截图判断是谁挡住了点击、停在了哪一步
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots-${{ matrix.os }}
          path: '**/.vitest/attachments/failure-screenshots/'
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:docs
      - run: pnpm build:host

  # 发布产物：pnpm pack 的包在仓库之外的独立应用里安装、类型检查、构建并在浏览器里运行
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 浏览器从 Playwright 的 CDN 下载，偶尔连不上（TLS、超时）：重试三次再算失败
      - name: Install browsers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm test:consumer
