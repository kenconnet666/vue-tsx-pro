name: CI

on:
  push:
    branches: [master]
  pull_request:

# master 上每次推送都跑完（小步快跑时连着推送，取消上一次就永远等不到完整的结果）；PR 上新的提交取消旧的
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 五个任务并行。静态检查与系统无关，只在 Ubuntu 上跑；
# 测试与构建在 Windows 上也跑：本地开发在 Windows，路径与虚拟模块问题只会在那里暴露
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 与本地推送前跑的是同一个脚本
      - run: pnpm check
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 最慢的任务（Windows 上近 10 分钟）分三片并行，每片跑三分之一的测试文件
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 浏览器从 Playwright 的 CDN 下载，偶尔连不上（TLS、超时）：重试三次再算失败；偶尔会卡住不动（一片等了半小时还在下载），每次最多 10 分钟，超时就进下一次重试
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      # Windows 上 Firefox 偶尔三分钟都连不上测试服务器：整个浏览器实例没跑，用例的重试轮不到它。
      # 只在这种情况下整步再跑一次，用例失败照常算失败
      - name: Browser tests
        shell: bash
        run: |
          pnpm test:browser --shard=${{ matrix.shard }}/3 2>&1 | tee browser.log && exit 0
          grep -q "Failed to connect to the browser session" browser.log || exit 1
          echo "::warning::浏览器会话没连上，整步重跑一次"
          pnpm test:browser --shard=${{ matrix.shard }}/3
      # 偶发失败只在 CI 上出现时，靠失败截图判断是谁挡住了点击、停在了哪一步
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots-${{ matrix.os }}-${{ matrix.shard }}
          path: '**/.vitest/attachments/failure-screenshots/'
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # 流程引擎的实库套件：MySQL 8.0.18（PolarDB 基线）、PG 17 的服务容器（ORM 各方言的实库测试在 easy-query-ts 仓库）
  db:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.18
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eqts
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec vitest run --configLoader native --project flow
        env:
          EQTS_MYSQL_URLS: mysql://root:root@127.0.0.1:3306
          EQTS_PG_URLS: postgres://postgres:postgres@127.0.0.1:5432/eqts

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:docs
      - run: pnpm build:host

  # 文档站的预渲染页逐页在浏览器里水合，有不一致就失败（构建时打开不一致的细节，日志里能看到是哪个节点）
  hydration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm build:docs
        env:
          VTP_HYDRATION_DETAILS: '1'
      - run: node scripts/docs/hydration.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          include-hidden-files: true
          retention-days: 1

  # 文档站全部示例的截图（亮、暗）与上一次 master 全部通过的运行比对：差异图作为产物上传、任务摘要列出变了的示例。
  # 只报告不失败——外观的改动多半是有意的，由提交的人看差异图确认；这次的截图存成下一次的基线
  visual:
    needs: [hydration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/docs/dist
      - name: Serve the built docs
        shell: bash
        run: |
          pnpm --filter @vue-tsx-pro/docs preview --port 5174 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5174/ > /dev/null && exit 0; sleep 1; done
          cat preview.log
          exit 1
      - name: Screenshots
        run: node scripts/docs/shots-batch.mjs current all --jobs=4 --variants=rtl,forced,mobile
      - name: Reference (last fully green master run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow ci.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then
            gh run download "$id" --name docs-shots --dir node_modules/.cache/docs-shots-reference || echo "run $id has no docs-shots"
          fi
      - name: Compare
        run: node scripts/docs/shots-compare.mjs reference current --summary="$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: docs-shots
          path: node_modules/.cache/docs-shots-current
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: docs-shots-diff
          path: node_modules/.cache/docs-shots-diff
          if-no-files-found: ignore
          retention-days: 14

  # 全栈示例（Nitro）：构建产物上的端到端测试，按页面的模式跑一遍、整站浏览器渲染（RENDER_MODE=csr）再跑一遍
  fullstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/fullstack-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm --filter @vue-tsx-pro/fullstack-demo build
      - run: pnpm --filter @vue-tsx-pro/fullstack-demo test:e2e

  # 流程引擎示例：构建产物上的审批端到端测试，两种渲染模式各一遍
  flow-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/flow-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm --filter @vue-tsx-pro/flow-demo build
      - run: pnpm --filter @vue-tsx-pro/flow-demo test:e2e

  # 发布产物：pnpm pack 的包在仓库之外的独立应用里安装、类型检查、构建并在浏览器里运行
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # 浏览器从 Playwright 的 CDN 下载，偶尔连不上（TLS、超时）：重试三次再算失败
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm test:consumer
      # 体积预算：test:consumer 构建过 dist，组件库各入口打包后的 gzip 大小不超过 size-budgets.json
      - run: pnpm --filter @zerodep-dev/vue-tsx-pro-ui size

  # peer 区间的下限：按组件库与框架 peerDependencies 里最低的版本（vue 3.5.0、vite 8.0.0……）再装一遍、构建、在浏览器里跑
  consumer-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install browsers
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            timeout 600 pnpm --filter @vue-tsx-pro/host-demo exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt), retrying"
            sleep 15
          done
          exit 1
      - run: pnpm test:consumer
        env:
          CONSUMER_RANGE: min

  # 移动端：微信、支付宝两端的小程序产物构建得出来，支付宝的产物用 minidev 离线编译一遍
  #（WXML / WXSS 的编译检查要用微信开发者工具，只有 Windows 与 macOS 版，在本地做）
  mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zerodep-dev/vue-tsx-pro-tsx --filter @zerodep-dev/vue-tsx-pro-mobile --filter @zerodep-dev/vue-tsx-pro-mini build
      - run: pnpm --filter @vue-tsx-pro/mobile-demo build
      - run: pnpm dlx minidev@2.2.5 build -p apps/mobile-demo/dist/my -o "${{ runner.temp }}/minidev" --machine-output

  # 把通过检查的产物上传到 Cloudflare：内容没变的文件不会重传，所以每次推送都跑也不费事
  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, hydration]
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN 存在 docs 环境里，该环境只允许 master 使用：别的分支改了 workflow 也拿不到（同 easy-query-ts）
    environment:
      name: docs
      url: https://vue-tsx-pro.zerodep.dpdns.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/docs/dist
      # 没有预渲染的地址（找不到的页面）由浏览器渲染
      - run: cp apps/docs/dist/spa.html apps/docs/dist/404.html
      - name: Deploy
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::docs 环境里没有 CLOUDFLARE_API_TOKEN，文档站没有部署'
            exit 1
          fi
          npx --yes wrangler@4.156.1 deploy
