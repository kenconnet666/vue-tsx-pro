name: App

# 移动端的原生应用（apps/mobile-demo 的 Capacitor 外壳）：安卓出调试 APK，iOS 出模拟器包，各自在模拟器里装上、
# 打开、截图。发布包每次也构建：安卓的 AAB 有正式密钥（仓库 secrets）就签名上传，没有时用临时密钥只验证能签；
# iOS 每次做不签名的设备归档，有证书与描述文件时签名导出 IPA。要放哪些 secrets 见 apps/mobile-demo/README.md。
# 推 app-v1.2.0 这样的标签时版本号取标签
on:
  push:
    branches: [master]
    tags: ['app-v*']
    paths:
      - packages/tsx/**
      - packages/mobile/**
      - apps/mobile-demo/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  pull_request:
    paths:
      - packages/tsx/**
      - packages/mobile/**
      - apps/mobile-demo/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Capacitor 8 要 JDK 21；SDK 用镜像里装好的（ANDROID_HOME），缺的平台 Gradle 自己下
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm --filter @zerodep-dev/vue-tsx-pro-tsx --filter @zerodep-dev/vue-tsx-pro-mobile build
      - run: pnpm --filter @vue-tsx-pro/mobile-demo build:h5
      - run: pnpm --filter @vue-tsx-pro/mobile-demo exec cap sync android
      - name: Build debug APK
        working-directory: apps/mobile-demo/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile-demo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # 发布包的签名密钥：仓库 secrets 里有就解出来；没有时临时生成一个，只为验证 release 的构建与签名走得通（这个包不上传）
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          file="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$file"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore "$file" -storepass ephemeral -keypass ephemeral               -alias ephemeral -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI ephemeral"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
          # 版本：标签 app-v1.2.0 → 1.2.0；平时 0.0.<运行序号>
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then name="${GITHUB_REF_NAME#app-v}"; else name="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build release AAB
        working-directory: apps/mobile-demo/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ephemeral' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ephemeral' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ephemeral' }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.real == 'true'
        with:
          name: android-release-aab
          path: apps/mobile-demo/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # 在安卓模拟器里装上 APK、打开首页截图；页面里没被捕获的错误（WebView 控制台的 Uncaught）算失败；
  # 再验证键盘弹起时页面变矮（test/android-keyboard.sh）
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/mobile-demo/test
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
      # 模拟器要 KVM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app-debug.apk
            adb logcat -c
            adb shell am start -n dev.zerodep.vuetsxpro.demo/.MainActivity
            sleep 15
            adb exec-out screencap -p > android-index.png
            # 只看 WebView 的控制台（Capacitor/Console），系统进程的日志里也会有 TypeError 字样
            adb logcat -d -s Capacitor/Console:* Capacitor:* > android-logcat.txt
            # 只算没被捕获的错误：Capacitor 自己捕获后打出来的（如 Error injecting safe area CSS，时有时无）不算
            if grep "Uncaught" android-logcat.txt; then exit 1; fi
            bash apps/mobile-demo/test/android-keyboard.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: |
            android-*.png
            android-*.xml
            android-logcat.txt

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zerodep-dev/vue-tsx-pro-tsx --filter @zerodep-dev/vue-tsx-pro-mobile build
      - run: pnpm --filter @vue-tsx-pro/mobile-demo build:h5
      - run: pnpm --filter @vue-tsx-pro/mobile-demo exec cap sync ios
      - name: Build for simulator
        working-directory: apps/mobile-demo/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # 在模拟器里装上、打开、截图：设备取镜像里的第一个 iPhone
      - name: Run in simulator
        working-directory: apps/mobile-demo/ios/App
        run: |
          device=$(xcrun simctl list devices available -j | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const all=Object.values(JSON.parse(s).devices).flat();console.log(all.find(d=>d.name.startsWith('iPhone')).udid)})")
          xcrun simctl boot "$device"
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" dev.zerodep.vuetsxpro.demo
          sleep 15
          xcrun simctl io "$device" screenshot "$GITHUB_WORKSPACE/ios-index.png"
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/App-simulator.zip" App.app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: |
            App-simulator.zip
            ios-index.png
      # 设备包：有分发证书（.p12）与描述文件时导入临时钥匙串、手动签名归档并导出 IPA；没有时做不签名的归档，验证 release 编译走得通
      - name: Archive for device
        working-directory: apps/mobile-demo/ios/App
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then version="${GITHUB_REF_NAME#app-v}"; else version="0.0.$GITHUB_RUN_NUMBER"; fi
          archive="$RUNNER_TEMP/App.xcarchive"
          common=(-project App.xcodeproj -scheme App -configuration Release -sdk iphoneos
            -destination 'generic/platform=iOS' -archivePath "$archive"
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER")
          if [ -z "$CERT_P12_BASE64" ]; then
            xcodebuild "${common[@]}" CODE_SIGNING_ALLOWED=NO archive
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$profile"
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid=$(plutil -extract UUID raw "$plist")
          name=$(plutil -extract Name raw "$plist")
          mkdir -p ~/Library/MobileDevice/Provisioning Profiles
          cp "$profile" ~/Library/MobileDevice/Provisioning Profiles/"$uuid".mobileprovision
          xcodebuild "${common[@]}" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID"             CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$name" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>dev.zerodep.vuetsxpro.demo</key><string>$name</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$GITHUB_WORKSPACE/ipa"
      - uses: actions/upload-artifact@v7
        if: hashFiles('ipa/*.ipa') != ''
        with:
          name: ios-ipa
          path: ipa/*.ipa
