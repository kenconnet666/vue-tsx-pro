name: App

# 移动端的原生应用（apps/mobile-demo 的 Capacitor 外壳）：安卓出调试 APK，iOS 出模拟器包，各自在模拟器里装上、
# 打开、截图。没有签名：正式的 AAB / IPA 要签名证书与商店账号，等有了再加发布任务
on:
  push:
    branches: [master]
    paths:
      - packages/tsx/**
      - packages/mobile/**
      - apps/mobile-demo/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  pull_request:
    paths:
      - packages/tsx/**
      - packages/mobile/**
      - apps/mobile-demo/**
      - pnpm-lock.yaml
      - .github/workflows/app.yml
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Capacitor 8 要 JDK 21；SDK 用镜像里装好的（ANDROID_HOME），缺的平台 Gradle 自己下
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm --filter @zerodep-dev/vue-tsx-pro-tsx --filter @zerodep-dev/vue-tsx-pro-mobile build
      - run: pnpm --filter @vue-tsx-pro/mobile-demo build:h5
      - run: pnpm --filter @vue-tsx-pro/mobile-demo exec cap sync android
      - name: Build debug APK
        working-directory: apps/mobile-demo/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile-demo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 在安卓模拟器里装上 APK、打开首页截图；页面里没被捕获的错误（WebView 控制台的 Uncaught）算失败
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
      # 模拟器要 KVM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app-debug.apk
            adb logcat -c
            adb shell am start -n dev.zerodep.vuetsxpro.demo/.MainActivity
            sleep 15
            adb exec-out screencap -p > android-index.png
            # 只看 WebView 的控制台（Capacitor/Console），系统进程的日志里也会有 TypeError 字样
            adb logcat -d -s Capacitor/Console:* Capacitor:* > android-logcat.txt
            # 只算没被捕获的错误：Capacitor 自己捕获后打出来的（如 Error injecting safe area CSS，时有时无）不算
            if grep "Uncaught" android-logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: |
            android-*.png
            android-logcat.txt

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @zerodep-dev/vue-tsx-pro-tsx --filter @zerodep-dev/vue-tsx-pro-mobile build
      - run: pnpm --filter @vue-tsx-pro/mobile-demo build:h5
      - run: pnpm --filter @vue-tsx-pro/mobile-demo exec cap sync ios
      - name: Build for simulator
        working-directory: apps/mobile-demo/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # 在模拟器里装上、打开、截图：设备取镜像里的第一个 iPhone
      - name: Run in simulator
        working-directory: apps/mobile-demo/ios/App
        run: |
          device=$(xcrun simctl list devices available -j | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const all=Object.values(JSON.parse(s).devices).flat();console.log(all.find(d=>d.name.startsWith('iPhone')).udid)})")
          xcrun simctl boot "$device"
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" dev.zerodep.vuetsxpro.demo
          sleep 15
          xcrun simctl io "$device" screenshot "$GITHUB_WORKSPACE/ios-index.png"
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/App-simulator.zip" App.app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: |
            App-simulator.zip
            ios-index.png
